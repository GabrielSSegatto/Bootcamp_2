name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: [ '3.9', '3.10', '3.11' ]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov flake8

    - name: Lint com Flake8
      run: |
        # Para na primeira erro
        flake8 . --max-line-length=100 --exclude=venv,migrations,__pycache__ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Aviso para outros problemas
        flake8 . --max-line-length=100 --exclude=venv,migrations,__pycache__ --count --exit-zero --statistics

    - name: Rodar Testes com Pytest
      env:
        DATABASE_URL: "sqlite:///:memory:"
      run: |
        pytest testes/ -v --cov=services --cov-report=xml

    - name: Upload Coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
